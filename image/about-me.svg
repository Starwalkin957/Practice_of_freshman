<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="关于我页面插画：书桌前的学生与家乡元素">
  <defs>
    <linearGradient id="me-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF7FF"/>
      <stop offset="100%" stop-color="#FFF3E4"/>
    </linearGradient>
  </defs>

  <rect width="640" height="360" fill="url(#me-bg)"/>
  <g fill="#12A7E8" opacity=".09">
    <circle cx="90" cy="66" r="40"/><circle cx="560" cy="92" r="46"/>
    <circle cx="500" cy="300" r="34"/>
  </g>

  <!-- 窗景：长江与观音阁剪影 -->
  <g transform="translate(392,44)">
    <rect x="0" y="0" width="200" height="150" rx="14" fill="#D6F0FF"/>
    <rect x="0" y="0" width="200" height="150" rx="14" fill="none" stroke="#FFFFFF" stroke-width="8"/>
    <line x1="100" y1="4" x2="100" y2="146" stroke="#FFFFFF" stroke-width="6"/>
    <line x1="4" y1="75" x2="196" y2="75" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="152" cy="36" r="18" fill="#FFC629"/>
    <path d="M8 108 Q44 88 84 104 Q124 84 164 102 L192 100 L192 146 L8 146 Z" fill="#12A7E8" opacity=".7"/>
    <path d="M20 104 Q52 82 90 98 Q130 80 170 98 L192 96 L192 108 L20 110 Z" fill="#18C08A" opacity=".6"/>
    <g transform="translate(96,86)">
      <rect x="-11" y="6" width="22" height="14" rx="2" fill="#FFFFFF"/>
      <path d="M-17 7 L0 -5 L17 7 Z" fill="#FF4D4D"/>
      <rect x="-7" y="-8" width="14" height="8" fill="#FFFFFF"/>
      <path d="M-11 -7 L0 -16 L11 -7 Z" fill="#FF8A2B"/>
    </g>
  </g>

  <!-- 书桌 -->
  <rect x="40" y="252" width="560" height="18" rx="8" fill="#C98A4B"/>
  <rect x="70" y="270" width="16" height="70" rx="5" fill="#B3773C"/>
  <rect x="554" y="270" width="16" height="70" rx="5" fill="#B3773C"/>

  <!-- 笔记本电脑 -->
  <g transform="translate(330,186)">
    <rect x="0" y="0" width="150" height="94" rx="8" fill="#4E5686"/>
    <rect x="8" y="8" width="134" height="78" rx="5" fill="#8FD6FF"/>
    <g fill="#FFFFFF" opacity=".85">
      <rect x="18" y="20" width="66" height="8" rx="4"/>
      <rect x="18" y="36" width="104" height="6" rx="3"/>
      <rect x="18" y="48" width="86" height="6" rx="3"/>
      <rect x="18" y="60" width="96" height="6" rx="3"/>
    </g>
    <rect x="-16" y="94" width="182" height="12" rx="6" fill="#C6D2E4"/>
    <rect x="56" y="94" width="38" height="6" rx="3" fill="#8494AA"/>
  </g>

  <!-- 人物 -->
  <g transform="translate(188,164)">
    <!-- 身体 -->
    <path d="M-52 104 Q-58 34 -26 16 L26 16 Q58 34 52 104 Z" fill="#7A5CFF"/>
    <path d="M-52 104 Q-58 34 -26 16 L-6 16 Q-30 40 -26 104 Z" fill="#5638D8"/>
    <!-- 手臂 -->
    <path d="M-34 34 Q-70 56 -60 88" stroke="#7A5CFF" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M34 34 Q78 48 96 30" stroke="#7A5CFF" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="-60" cy="90" r="11" fill="#FFDCC0"/>
    <circle cx="98" cy="28" r="11" fill="#FFDCC0"/>
    <!-- 头 -->
    <circle cx="0" cy="-24" r="34" fill="#FFDCC0"/>
    <!-- 头发 -->
    <path d="M-34 -30 Q-30 -64 0 -62 Q32 -64 34 -28 Q22 -46 0 -44 Q-22 -46 -34 -30 Z" fill="#2E2A3B"/>
    <path d="M-34 -28 Q-40 -12 -34 2 Q-42 -14 -36 -32 Z" fill="#2E2A3B"/>
    <path d="M34 -28 Q40 -12 34 2 Q42 -14 36 -32 Z" fill="#2E2A3B"/>
    <!-- 五官 -->
    <g fill="#152238">
      <ellipse cx="-12" cy="-24" rx="3.6" ry="4.6"/>
      <ellipse cx="12" cy="-24" rx="3.6" ry="4.6"/>
    </g>
    <path d="M-9 -8 q9 8 18 0" stroke="#C2705A" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <circle cx="-22" cy="-12" r="5" fill="#FF9EB5" opacity=".6"/>
    <circle cx="22" cy="-12" r="5" fill="#FF9EB5" opacity=".6"/>
  </g>

  <!-- 桌上小物：茶杯 -->
  <g transform="translate(108,222)">
    <path d="M0 0 L44 0 L38 30 L6 30 Z" fill="#FFFFFF"/>
    <path d="M44 6 q18 2 14 14 q-4 10 -18 8" stroke="#FFFFFF" stroke-width="6" fill="none"/>
    <ellipse cx="22" cy="0" rx="22" ry="6" fill="#18C08A"/>
    <g stroke="#C6D2E4" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9">
      <path d="M14 -14 q-6 -10 2 -18"/><path d="M30 -14 q-6 -10 2 -18"/>
    </g>
  </g>

  <!-- 桌上小物：书堆 -->
  <g transform="translate(512,222)">
    <rect x="0" y="18" width="84" height="14" rx="4" fill="#FF5C8A"/>
    <rect x="6" y="4" width="76" height="14" rx="4" fill="#18C08A"/>
    <rect x="-2" y="-10" width="88" height="14" rx="4" fill="#FFC629"/>
    <g stroke="#FFFFFF" stroke-width="3" opacity=".7">
      <line x1="10" y1="25" x2="70" y2="25"/>
      <line x1="16" y1="11" x2="70" y2="11"/>
      <line x1="8" y1="-3" x2="76" y2="-3"/>
    </g>
  </g>
