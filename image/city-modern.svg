<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="现代鄂州城市天际线与跨江大桥插画">
  <defs>
    <linearGradient id="c-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12A7E8"/>
      <stop offset="62%" stop-color="#8FE3FF"/>
      <stop offset="100%" stop-color="#FFE9C9"/>
    </linearGradient>
    <linearGradient id="c-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8E6FF"/>
      <stop offset="100%" stop-color="#5FA8E0"/>
    </linearGradient>
    <linearGradient id="c-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12A7E8"/>
      <stop offset="100%" stop-color="#0A5E92"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#c-sky)"/>
  <circle cx="94" cy="80" r="38" fill="#FFC629" opacity=".9"/>
  <g fill="#FFFFFF" opacity=".8">
    <ellipse cx="420" cy="72" rx="54" ry="18"/>
    <ellipse cx="456" cy="62" rx="34" ry="20"/>
    <ellipse cx="220" cy="52" rx="40" ry="14"/>
  </g>

  <!-- 远景楼群 -->
  <g fill="#7FB6DC" opacity=".62">
    <rect x="20" y="180" width="42" height="120"/>
    <rect x="70" y="150" width="34" height="150"/>
    <rect x="112" y="196" width="46" height="104"/>
    <rect x="166" y="164" width="30" height="136"/>
    <rect x="440" y="176" width="40" height="124"/>
    <rect x="488" y="146" width="32" height="154"/>
    <rect x="528" y="190" width="48" height="110"/>
    <rect x="584" y="166" width="36" height="134"/>
  </g>

  <!-- 主体高楼 -->
  <g transform="translate(216,96)">
    <rect x="0" y="0" width="66" height="204" rx="6" fill="url(#c-glass)"/>
    <g fill="#FFFFFF" opacity=".55">
      <rect x="8" y="14" width="14" height="12" rx="2"/><rect x="28" y="14" width="14" height="12" rx="2"/><rect x="46" y="14" width="12" height="12" rx="2"/>
      <rect x="8" y="38" width="14" height="12" rx="2"/><rect x="28" y="38" width="14" height="12" rx="2"/><rect x="46" y="38" width="12" height="12" rx="2"/>
      <rect x="8" y="62" width="14" height="12" rx="2"/><rect x="28" y="62" width="14" height="12" rx="2"/><rect x="46" y="62" width="12" height="12" rx="2"/>
      <rect x="8" y="86" width="14" height="12" rx="2"/><rect x="28" y="86" width="14" height="12" rx="2"/><rect x="46" y="86" width="12" height="12" rx="2"/>
      <rect x="8" y="110" width="14" height="12" rx="2"/><rect x="28" y="110" width="14" height="12" rx="2"/><rect x="46" y="110" width="12" height="12" rx="2"/>
      <rect x="8" y="134" width="14" height="12" rx="2"/><rect x="28" y="134" width="14" height="12" rx="2"/><rect x="46" y="134" width="12" height="12" rx="2"/>
      <rect x="8" y="158" width="14" height="12" rx="2"/><rect x="28" y="158" width="14" height="12" rx="2"/><rect x="46" y="158" width="12" height="12" rx="2"/>
    </g>
    <path d="M33 -30 L45 -6 L21 -6 Z" fill="#FF5C8A"/>
    <rect x="30" y="-52" width="6" height="24" fill="#C6D2E4"/>
    <circle cx="33" cy="-56" r="6" fill="#FF4D4D"/>
  </g>

  <g transform="translate(300,140)">
    <rect x="0" y="0" width="86" height="160" rx="6" fill="#FF8A2B"/>
    <rect x="0" y="0" width="86" height="160" rx="6" fill="#FFFFFF" opacity=".18"/>
    <g fill="#FFF3E4" opacity=".85">
      <rect x="10" y="14" width="26" height="14" rx="3"/><rect x="48" y="14" width="26" height="14" rx="3"/>
      <rect x="10" y="40" width="26" height="14" rx="3"/><rect x="48" y="40" width="26" height="14" rx="3"/>
      <rect x="10" y="66" width="26" height="14" rx="3"/><rect x="48" y="66" width="26" height="14" rx="3"/>
      <rect x="10" y="92" width="26" height="14" rx="3"/><rect x="48" y="92" width="26" height="14" rx="3"/>
      <rect x="10" y="118" width="26" height="14" rx="3"/><rect x="48" y="118" width="26" height="14" rx="3"/>
    </g>
    <path d="M0 0 L43 -26 L86 0 Z" fill="#FFC629"/>
  </g>

  <g transform="translate(400,178)">
    <rect x="0" y="0" width="54" height="122" rx="5" fill="#7A5CFF"/>
    <g fill="#FFFFFF" opacity=".5">
      <rect x="8" y="12" width="12" height="10" rx="2"/><rect x="26" y="12" width="12" height="10" rx="2"/>
      <rect x="8" y="34" width="12" height="10" rx="2"/><rect x="26" y="34" width="12" height="10" rx="2"/>
      <rect x="8" y="56" width="12" height="10" rx="2"/><rect x="26" y="56" width="12" height="10" rx="2"/>
      <rect x="8" y="78" width="12" height="10" rx="2"/><rect x="26" y="78" width="12" height="10" rx="2"/>
    </g>
  </g>

  <!-- 江面 -->
  <rect x="0" y="292" width="640" height="108" fill="url(#c-water)"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".34">
    <line x1="40" y1="322" x2="150" y2="322"/>
    <line x1="230" y1="348" x2="350" y2="348"/>
    <line x1="430" y1="326" x2="540" y2="326"/>
    <line x1="120" y1="374" x2="240" y2="374"/>
    <line x1="400" y1="380" x2="520" y2="380"/>
  </g>

  <!-- 跨江大桥 -->
  <g>
    <path d="M0 276 Q160 226 320 276 Q480 226 640 276" stroke="#FF4D4D" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="0" y="276" width="640" height="12" fill="#E23B3B"/>
    <rect x="0" y="288" width="640" height="5" fill="#B62A2A"/>
    <g fill="#FFC629">
      <rect x="150" y="240" width="16" height="52" rx="4"/>
      <rect x="474" y="240" width="16" height="52" rx="4"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="3.4" opacity=".85">
      <line x1="158" y1="244" x2="112" y2="278"/><line x1="158" y1="244" x2="204" y2="278"/>
      <line x1="482" y1="244" x2="436" y2="278"/><line x1="482" y1="244" x2="528" y2="278"/>
      <line x1="158" y1="244" x2="158" y2="278"/><line x1="482" y1="244" x2="482" y2="278"/>
    </g>
    <g fill="#8B6A4B">
      <rect x="66" y="290" width="14" height="34" rx="3"/>
      <rect x="256" y="290" width="14" height="34" rx="3"/>
      <rect x="376" y="290" width="14" height="34" rx="3"/>
      <rect x="560" y="290" width="14" height="34" rx="3"/>
    </g>
  </g>

  <!-- 江上轮船 -->
  <g transform="translate(268,340)">
    <path d="M0 0 L104 0 L88 24 L16 24 Z" fill="#FFFFFF"/>
    <rect x="26" y="-20" width="46" height="20" rx="4" fill="#FF8A2B"/>
    <rect x="58" y="-34" width="10" height="16" fill="#C6D2E4"/>
    <g fill="#12A7E8"><rect x="32" y="-14" width="10" height="9" rx="2"/><rect x="48" y="-14" width="10" height="9" rx="2"/></g>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#4A3527" stroke-width="4" fill="none" stroke-linecap="round" opacity=".5">
    <path d="M470 118 q10 -10 20 0 q10 -10 20 0"/>
    <path d="M530 96 q8 -8 16 0 q8 -8 16 0"/>
  </g>
</svg>
