<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="梁子湖生态风光插画">
  <defs>
    <linearGradient id="l-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12A7E8"/>
      <stop offset="100%" stop-color="#C8F2FF"/>
    </linearGradient>
    <linearGradient id="l-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3FCBE0"/>
      <stop offset="100%" stop-color="#0E8FA8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#l-sky)"/>
  <circle cx="530" cy="72" r="40" fill="#FFC629"/>
  <circle cx="530" cy="72" r="60" fill="#FFC629" opacity=".2"/>

  <g fill="#FFFFFF" opacity=".85">
    <ellipse cx="128" cy="72" rx="52" ry="20"/>
    <ellipse cx="164" cy="60" rx="34" ry="22"/>
    <ellipse cx="94" cy="62" rx="28" ry="16"/>
    <ellipse cx="360" cy="52" rx="44" ry="16"/>
  </g>

  <!-- 远岸小山 -->
  <path d="M0 214 Q86 164 168 206 Q244 168 330 210 Q420 172 500 208 Q576 180 640 212 L640 240 L0 240 Z" fill="#18C08A" opacity=".72"/>
  <path d="M0 228 Q110 196 210 226 Q330 196 430 228 Q540 202 640 230 L640 252 L0 252 Z" fill="#0E8F66" opacity=".62"/>

  <!-- 湖面 -->
  <rect x="0" y="240" width="640" height="160" fill="url(#l-water)"/>
  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".4">
    <line x1="40" y1="276" x2="160" y2="276"/>
    <line x1="220" y1="304" x2="356" y2="304"/>
    <line x1="430" y1="272" x2="540" y2="272"/>
    <line x1="90" y1="336" x2="212" y2="336"/>
    <line x1="300" y1="356" x2="440" y2="356"/>
    <line x1="500" y1="330" x2="606" y2="330"/>
  </g>

  <!-- 湖中小岛 -->
  <g transform="translate(430,214)">
    <ellipse cx="0" cy="26" rx="70" ry="16" fill="#0E8F66"/>
    <ellipse cx="0" cy="22" rx="62" ry="14" fill="#18C08A"/>
    <rect x="-4" y="-6" width="8" height="28" fill="#8B6A4B"/>
    <circle cx="0" cy="-16" r="20" fill="#12B87F"/>
    <circle cx="-16" cy="-6" r="14" fill="#18C08A"/>
    <circle cx="16" cy="-6" r="14" fill="#18C08A"/>
  </g>

  <!-- 渔船 -->
  <g transform="translate(120,300)">
    <path d="M0 0 L110 0 L94 26 L16 26 Z" fill="#FF8A2B"/>
    <path d="M0 0 L110 0 L104 8 L6 8 Z" fill="#FFC629"/>
    <rect x="46" y="-40" width="6" height="40" fill="#8B6A4B"/>
    <path d="M52 -38 L92 -8 L52 -8 Z" fill="#FFFFFF"/>
    <path d="M46 -38 L14 -8 L46 -8 Z" fill="#FFFDF8"/>
  </g>

  <!-- 荷花 -->
  <g transform="translate(300,352)">
    <ellipse cx="0" cy="0" rx="42" ry="14" fill="#18C08A"/>
    <ellipse cx="0" cy="-4" rx="34" ry="10" fill="#3FDCA8"/>
    <path d="M48 -2 q10 -26 22 -6 q-8 12 -22 6 Z" fill="#FF5C8A"/>
    <path d="M56 -6 q4 -20 12 -4" stroke="#FF8FA8" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(520,372)">
    <ellipse cx="0" cy="0" rx="36" ry="12" fill="#18C08A"/>
    <ellipse cx="0" cy="-3" rx="28" ry="8" fill="#3FDCA8"/>
  </g>

  <!-- 白鹭 -->
  <g transform="translate(224,232)" fill="#FFFFFF">
    <ellipse cx="0" cy="0" rx="20" ry="12"/>
    <path d="M14 -6 q22 -18 26 -2 q-14 6 -26 2 Z"/>
    <circle cx="-18" cy="-12" r="8"/>
    <path d="M-24 -12 l-16 4 l16 5 Z" fill="#FFC629"/>
    <rect x="-6" y="10" width="4" height="20" fill="#FF8A2B"/>
    <rect x="6" y="10" width="4" height="20" fill="#FF8A2B"/>
    <circle cx="-20" cy="-13" r="2" fill="#152238"/>
  </g>
</svg>
