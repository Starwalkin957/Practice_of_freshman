<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="万里长江第一阁观音阁立于江心龙蟠矶之上">
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE37A"/>
      <stop offset="55%" stop-color="#FFB27A"/>
      <stop offset="100%" stop-color="#FF8FA8"/>
    </linearGradient>
    <linearGradient id="g-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12A7E8"/>
      <stop offset="100%" stop-color="#0A5E92"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#g-sky)"/>
  <circle cx="330" cy="176" r="58" fill="#FFF3B0" opacity=".92"/>
  <circle cx="330" cy="176" r="86" fill="#FFFFFF" opacity=".24"/>

  <g fill="#FFFFFF" opacity=".6">
    <ellipse cx="118" cy="86" rx="56" ry="18"/>
    <ellipse cx="152" cy="76" rx="36" ry="20"/>
    <ellipse cx="520" cy="66" rx="48" ry="16"/>
    <ellipse cx="552" cy="58" rx="30" ry="16"/>
  </g>

  <!-- 远岸 -->
  <path d="M0 232 Q110 200 210 226 Q300 208 400 230 Q510 210 640 234 L640 258 L0 258 Z" fill="#7A5CFF" opacity=".34"/>

  <!-- 江面 -->
  <rect x="0" y="248" width="640" height="152" fill="url(#g-water)"/>

  <!-- 龙蟠矶 -->
  <path d="M186 300 Q214 262 274 258 Q356 254 400 296 Q416 320 392 328 L206 328 Q176 320 186 300 Z" fill="#8B6A4B"/>
  <path d="M210 296 Q236 270 280 268 Q344 264 378 294 Z" fill="#B08A62"/>
  <g fill="#6E5238" opacity=".6">
    <ellipse cx="238" cy="312" rx="20" ry="7"/>
    <ellipse cx="342" cy="316" rx="24" ry="7"/>
  </g>

  <!-- 观音阁 -->
  <g transform="translate(232,142)">
    <rect x="4" y="100" width="120" height="56" rx="4" fill="#FFFDF8"/>
    <rect x="4" y="100" width="120" height="13" fill="#EFE0CC"/>
    <g fill="#4A3527">
      <rect x="20" y="122" width="17" height="34" rx="3"/>
      <rect x="55" y="122" width="17" height="34" rx="3"/>
      <rect x="90" y="122" width="17" height="34" rx="3"/>
    </g>
    <path d="M-18 102 L64 60 L146 102 Z" fill="#E23B3B"/>
    <path d="M-6 102 L64 72 L134 102 Z" fill="#B62A2A" opacity=".5"/>
    <path d="M-18 102 Q-32 96 -27 86" stroke="#E23B3B" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M146 102 Q160 96 155 86" stroke="#E23B3B" stroke-width="6" fill="none" stroke-linecap="round"/>

    <rect x="20" y="40" width="88" height="34" rx="3" fill="#FFFDF8"/>
    <path d="M2 42 L64 12 L126 42 Z" fill="#FF8A2B"/>
    <g fill="#4A3527"><rect x="36" y="52" width="15" height="22" rx="2"/><rect x="77" y="52" width="15" height="22" rx="2"/></g>

    <rect x="59" y="-16" width="9" height="30" fill="#7A5CFF"/>
    <circle cx="63.5" cy="-22" r="9" fill="#FFC629"/>
    <circle cx="63.5" cy="-22" r="4" fill="#FF8A2B"/>
  </g>

  <!-- 水面倒影 -->
  <g opacity=".26">
    <rect x="236" y="330" width="120" height="42" fill="#FFFDF8"/>
    <path d="M218 330 L296 366 L374 330 Z" fill="#E23B3B"/>
  </g>

  <g stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".38">
    <line x1="30" y1="286" x2="150" y2="286"/>
    <line x1="440" y1="282" x2="560" y2="282"/>
    <line x1="80" y1="356" x2="200" y2="356"/>
    <line x1="420" y1="362" x2="556" y2="362"/>
    <line x1="250" y1="384" x2="370" y2="384"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#4A3527" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6">
    <path d="M96 146 q12 -12 24 0 q12 -12 24 0"/>
    <path d="M486 122 q10 -10 20 0 q10 -10 20 0"/>
  </g>
</svg>
