<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="梁子湖大闸蟹与沙窝豆丝等鄂州美食插画">
  <defs>
    <linearGradient id="d-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF3E4"/>
      <stop offset="100%" stop-color="#FFE9EE"/>
    </linearGradient>
    <linearGradient id="d-crab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8A5C"/>
      <stop offset="100%" stop-color="#E2452B"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#d-bg)"/>

  <!-- 底纹圆点 -->
  <g fill="#FF8A2B" opacity=".1">
    <circle cx="70" cy="60" r="26"/><circle cx="580" cy="86" r="32"/>
    <circle cx="120" cy="340" r="28"/><circle cx="540" cy="330" r="24"/>
  </g>

  <!-- 左侧：大闸蟹 -->
  <g transform="translate(190,206)">
    <ellipse cx="0" cy="86" rx="118" ry="20" fill="#C9A279" opacity=".3"/>
    <!-- 腿 -->
    <g stroke="#E2452B" stroke-width="11" fill="none" stroke-linecap="round">
      <path d="M-56 -12 q-46 -22 -72 4"/>
      <path d="M-62 8 q-52 -6 -74 28"/>
      <path d="M-58 28 q-46 18 -58 52"/>
      <path d="M56 -12 q46 -22 72 4"/>
      <path d="M62 8 q52 -6 74 28"/>
      <path d="M58 28 q46 18 58 52"/>
    </g>
    <!-- 蟹钳 -->
    <g stroke="#E2452B" stroke-width="13" fill="none" stroke-linecap="round">
      <path d="M-48 -30 q-40 -40 -76 -30"/>
      <path d="M48 -30 q40 -40 76 -30"/>
    </g>
    <g transform="translate(-124,-62)">
      <path d="M0 0 q-26 -20 -40 4 q14 16 40 -4 Z" fill="url(#d-crab)"/>
      <path d="M0 0 q-16 24 6 30 q10 -18 -6 -30 Z" fill="#FF6B4A"/>
    </g>
    <g transform="translate(124,-62)">
      <path d="M0 0 q26 -20 40 4 q-14 16 -40 -4 Z" fill="url(#d-crab)"/>
      <path d="M0 0 q16 24 -6 30 q-10 -18 6 -30 Z" fill="#FF6B4A"/>
    </g>
    <!-- 蟹壳 -->
    <path d="M-70 24 Q-74 -34 0 -40 Q74 -34 70 24 Q40 52 0 52 Q-40 52 -70 24 Z" fill="url(#d-crab)"/>
    <path d="M-52 12 Q-54 -26 0 -30 Q54 -26 52 12 Q26 32 0 32 Q-26 32 -52 12 Z" fill="#FF8A5C" opacity=".55"/>
    <!-- 壳尖 -->
    <path d="M-30 -36 l-12 -16 l20 8 Z" fill="#E2452B"/>
    <path d="M30 -36 l12 -16 l-20 8 Z" fill="#E2452B"/>
    <!-- 眼 -->
    <g>
      <rect x="-24" y="-58" width="7" height="18" rx="3.5" fill="#8B3A22"/>
      <rect x="17" y="-58" width="7" height="18" rx="3.5" fill="#8B3A22"/>
      <circle cx="-20.5" cy="-62" r="9" fill="#152238"/>
      <circle cx="20.5" cy="-62" r="9" fill="#152238"/>
      <circle cx="-23" cy="-65" r="3" fill="#FFFFFF"/>
      <circle cx="18" cy="-65" r="3" fill="#FFFFFF"/>
    </g>
    <!-- 白肚 -->
    <path d="M-34 30 Q0 62 34 30 Q0 46 -34 30 Z" fill="#FFF6E4"/>
  </g>

  <!-- 右侧：豆丝（一碗） -->
  <g transform="translate(470,224)">
    <ellipse cx="0" cy="76" rx="104" ry="18" fill="#C9A279" opacity=".3"/>
    <!-- 碗 -->
    <path d="M-92 -6 Q-86 66 0 70 Q86 66 92 -6 Z" fill="#FFFFFF"/>
    <path d="M-92 -6 Q-86 66 0 70 Q86 66 92 -6 Z" fill="#12A7E8" opacity=".12"/>
    <ellipse cx="0" cy="-6" rx="92" ry="24" fill="#F4F8FC"/>
    <path d="M-64 60 Q0 78 64 60 L58 70 Q0 86 -58 70 Z" fill="#E9EFF6"/>
    <!-- 豆丝条 -->
    <g stroke="#E8B76A" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M-62 -12 q26 -22 56 -6"/>
      <path d="M-46 -2 q34 -20 68 -2"/>
      <path d="M-56 -20 q30 -18 62 -8"/>
      <path d="M-30 6 q30 -18 58 -6"/>
      <path d="M-68 -4 q22 -16 44 -14"/>
    </g>
    <g stroke="#FFD9A0" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9">
      <path d="M-52 -8 q28 -18 58 -4"/>
      <path d="M-40 2 q30 -16 58 0"/>
    </g>
    <!-- 配料 -->
    <g fill="#18C08A"><ellipse cx="-34" cy="-24" rx="12" ry="6"/><ellipse cx="26" cy="-26" rx="11" ry="5.5"/></g>
    <g fill="#FF4D4D"><circle cx="6" cy="-24" r="7"/><circle cx="-14" cy="-30" r="6"/></g>
    <g fill="#FFC629"><circle cx="44" cy="-16" r="6"/></g>
    <!-- 热气 -->
    <g stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round" opacity=".8">
      <path d="M-34 -46 q-14 -20 4 -36 q16 -16 2 -34"/>
      <path d="M10 -50 q-14 -20 4 -36 q16 -16 2 -34"/>
      <path d="M50 -42 q-12 -18 4 -32 q14 -14 2 -30"/>
    </g>
  </g>

  <!-- 筷子 -->
  <g transform="translate(300,340) rotate(-8)">
    <rect x="0" y="0" width="176" height="9" rx="4.5" fill="#C98A4B"/>
    <rect x="0" y="16" width="176" height="9" rx="4.5" fill="#B3773C"/>
  </g>
</svg>
